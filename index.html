<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloco de Notas Moderno</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="topo">
            <div class="cabecalho">
                <span class="etiqueta">Notas rápidas</span>
                <h1>Meu Bloco de Notas</h1>
            </div>
            <label class="seletor-tema" for="tema">
                <span>Modo escuro</span>
                <input type="checkbox" id="tema" aria-label="Alternar modo escuro">
                <span class="interruptor" aria-hidden="true"></span>
            </label>
        </header>

        <p>Suas anotações são salvas automaticamente no seu navegador.</p>

        <section class="painel-informacoes" aria-label="Informações do bloco de notas">
            <div class="cartao-info">
                <span class="legenda-info">Status</span>
                <strong id="statusSalvamento" role="status" aria-live="polite">Salvamento automático ativo</strong>
            </div>
            <div class="cartao-info">
                <span class="legenda-info">Caracteres</span>
                <strong id="contadorCaracteres">0</strong>
            </div>
        </section>

        <textarea id="blocoDeNotas" placeholder="Comece a digitar aqui..." aria-label="Área de anotações"></textarea>

        <footer class="rodape">
            <span>Seu conteúdo fica salvo localmente neste navegador.</span>
            <span>Interface otimizada para claro e escuro.</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
